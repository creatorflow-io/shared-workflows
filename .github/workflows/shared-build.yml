name: Shared Build

on: 
  workflow_call:
    inputs:
      Stage:
        required: true
        type: string

env:
  GITHUB_PACKAGE_USERNAME: ${{ github.actor }}
  GITHUB_PACKAGE_TOKEN: ${{ secrets.GIT_HUB_PAT }}
  VersionSuffix: ${{ inputs.Stage }}.${{ github.run_number }}
  JuiceRefSuffix: '-${{ inputs.Stage }}.*'
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Output variables
      run: |
        echo Run number ${{ github.run_number }}
        echo VersionSuffix ${{env.VersionSuffix}}
        echo JuiceRefSuffix ${{env.JuiceRefSuffix}}
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
        dotnet-quality: 'preview'
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release --version-suffix ${{env.VersionSuffix}}
    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release