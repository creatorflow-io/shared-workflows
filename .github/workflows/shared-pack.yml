name: Shared Pack

on: 
  workflow_call:
    inputs:
      Stage:
        required: true
        type: string

env:
  GITHUB_PACKAGE_USERNAME: ${{ github.actor }}
  GITHUB_PACKAGE_TOKEN: ${{ secrets.GIT_HUB_PAT }}
  VersionSuffix: rc.${{ github.run_number }}
  JuiceRefSuffix: ''
  TargetFramework: 'net8.0'
jobs:
  pack:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version:  [ '8.0.x', '9.0.x' ]

    steps:
    - uses: actions/checkout@v4
    - name: Set Juice Suffix
      if: ${{ inputs.Stage != '' }}
      run: |
        refSuffix="-${{ inputs.Stage }}.*"
        echo "JuiceRefSuffix=$refSuffix" >> $GITHUB_ENV
        versionSuffix="${{ inputs.Stage }}.${{ github.run_number }}"
        echo "VersionSuffix=$versionSuffix" >> $GITHUB_ENV
    - name: Set target framework preview
      if: ${{ contains(matrix.dotnet-version, '9.0') }}
      run: |
        echo "TargetFramework=net9.0" >> $GITHUB_ENV
    - name: Output variables
      run: |
        echo Run number ${{ github.run_number }}
        echo VersionSuffix ${{env.VersionSuffix}}
        echo JuiceRefSuffix ${{env.JuiceRefSuffix}}
        echo TargetFramework ${{env.TargetFramework}}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore --property:AppTargetFramework=${{ env.TargetFramework }}
    - name: Build
      run: dotnet build --no-restore --configuration Release --version-suffix ${{env.VersionSuffix}} --property:AppTargetFramework=${{ env.TargetFramework }}
    - name: Pack
      run: dotnet pack --no-build --configuration Release --version-suffix ${{env.VersionSuffix}} --property:AppTargetFramework=${{ env.TargetFramework }}
    - name: Push Github packages
      run: dotnet nuget push **/*.nupkg --source "github" --skip-duplicate