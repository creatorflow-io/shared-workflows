name: Shared Publish Release

# Builds and packs the release, then pushes it to nuget.org with NUGET_ORG_KEY, or with PushToNuGet: false leaves the
# packages as the `nupkg` artifact for the caller to push. nuget.org trusted publishing needs the push in the caller's
# own workflow file: it does not accept a token from a reusable workflow in another repository (see README).
on: 
  workflow_call:
    secrets:
      NUGET_ORG_KEY:
        description: long-lived nuget.org API key, required when PushToNuGet is true
        required: false
      GIT_HUB_PAT:
        required: true
    inputs:
      Target:
        type: string
        default: |
          6.0.x
          8.0.x
          9.0.x
      PushToNuGet:
        description: push with NUGET_ORG_KEY; false leaves the packages as the nupkg artifact for the caller to push
        type: boolean
        default: true

env:
  GITHUB_PACKAGE_USERNAME: ${{ github.actor }}
  GITHUB_PACKAGE_TOKEN: ${{ secrets.GIT_HUB_PAT }}
  JuiceRefSuffix: ''
jobs:
  publish:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set version number environment variable
      env:
        github_tag: ${{ github.event.release.tag_name }}
      run: |
        version="${github_tag}"
        echo version=$version
        echo "version=$version" >> $GITHUB_ENV
    - name: Set Juice RC Version
      if: ${{ contains(github.event.release.tag_name, 'rc') }}
      run: |
        echo "JuiceRefSuffix=-rc.*" >> $GITHUB_ENV
    - name: Set Juice beta Version
      if: ${{ contains(github.event.release.tag_name, 'beta') }}
      run: |
        echo "JuiceRefSuffix=-beta.*" >> $GITHUB_ENV

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{inputs.Target}}

    - name: Restore dependencies
      run: dotnet restore --no-cache
    - name: Build
      run: dotnet build --no-restore --configuration Release -p:Version=${{env.version}}
    - name: Pack
      run: dotnet pack --no-build --configuration Release -p:Version=${{env.version}}
    - name: PushNuget
      if: ${{ inputs.PushToNuGet }}
      run: dotnet nuget push **/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_ORG_KEY }} --skip-duplicate
    - name: Collect packages
      if: ${{ !inputs.PushToNuGet }}
      run: |
        mkdir -p "$RUNNER_TEMP/nupkg"
        find . -path ./.git -prune -o \( -name '*.nupkg' -o -name '*.snupkg' \) -type f -print -exec cp {} "$RUNNER_TEMP/nupkg/" \;
    - name: Upload packages
      if: ${{ !inputs.PushToNuGet }}
      uses: actions/upload-artifact@v4
      with:
        name: nupkg
        path: ${{ runner.temp }}/nupkg
        if-no-files-found: error
        retention-days: 1
