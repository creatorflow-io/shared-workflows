name: Shared Publish Release

# Publishes to nuget.org with trusted publishing (OIDC) when NUGET_USER is set, else with the NUGET_ORG_KEY API key.
# Trusted publishing needs the calling job to grant `id-token: write` (see README).
on: 
  workflow_call:
    secrets:
      NUGET_USER:
        description: nuget.org profile name that owns the trusted publishing policy
        required: false
      NUGET_ORG_KEY:
        description: long-lived nuget.org API key, used only when NUGET_USER is not set
        required: false
      GIT_HUB_PAT:
        required: true
    inputs:
      Target:
        type: string
        default: |
          6.0.x
          8.0.x
          9.0.x

env:
  GITHUB_PACKAGE_USERNAME: ${{ github.actor }}
  GITHUB_PACKAGE_TOKEN: ${{ secrets.GIT_HUB_PAT }}
  JuiceRefSuffix: ''
  NUGET_USER: ${{ secrets.NUGET_USER }}
jobs:
  publish:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set version number environment variable
      env:
        github_tag: ${{ github.event.release.tag_name }}
      run: |
        version="${github_tag}"
        echo version=$version
        echo "version=$version" >> $GITHUB_ENV
    - name: Set Juice RC Version
      if: ${{ contains(github.event.release.tag_name, 'rc') }}
      run: |
        echo "JuiceRefSuffix=-rc.*" >> $GITHUB_ENV
    - name: Set Juice beta Version
      if: ${{ contains(github.event.release.tag_name, 'beta') }}
      run: |
        echo "JuiceRefSuffix=-beta.*" >> $GITHUB_ENV

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{inputs.Target}}

    - name: Restore dependencies
      run: dotnet restore --no-cache
    - name: Build
      run: dotnet build --no-restore --configuration Release -p:Version=${{env.version}}
    - name: Pack
      run: dotnet pack --no-build --configuration Release -p:Version=${{env.version}}
    # The temporary key lives one hour, so log in right before pushing.
    - name: NuGet login (trusted publishing)
      id: login
      if: ${{ env.NUGET_USER != '' }}
      uses: NuGet/login@v1
      with:
        user: ${{ env.NUGET_USER }}
    - name: PushNuget
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_ORG_KEY }}
      run: |
        if [ -z "$NUGET_API_KEY" ]; then
          echo "::error::Set the NUGET_USER secret (trusted publishing) or NUGET_ORG_KEY (API key)."
          exit 1
        fi
        dotnet nuget push **/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
