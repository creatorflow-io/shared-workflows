name: Shared Publish Release

on: 
  workflow_call:
    secrets:
      NUGET_ORG_KEY:
        required: true
      GIT_HUB_PAT:
        required: true

env:
  GITHUB_PACKAGE_USERNAME: ${{ github.actor }}
  GITHUB_PACKAGE_TOKEN: ${{ secrets.GIT_HUB_PAT }}
  JuiceRefSuffix: ''
  TargetFramework: 'net8.0'
jobs:
  publish:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: [ '8.0.x']

    steps:
    - uses: actions/checkout@v3
    - name: Set version number environment variable
      env:
        github_tag: ${{ github.event.release.tag_name }}
      run: |
        version="${github_tag}"
        echo version=$version
        echo "version=$version" >> $GITHUB_ENV
    - name: Set Juice RC Version
      if: ${{ contains(github.event.release.tag_name, 'rc') }}
      run: |
        echo "JuiceRefSuffix=-rc.*" >> $GITHUB_ENV
    - name: Set Juice beta Version
      if: ${{ contains(github.event.release.tag_name, 'beta') }}
      run: |
        echo "JuiceRefSuffix=-beta.*" >> $GITHUB_ENV
    - name: Set target framework preview
      if: ${{ contains(matrix.dotnet-version, '9.0') }}
      run: |
        echo "TargetFramework=net9.0" >> $GITHUB_ENV
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
    - name: Restore dependencies
      run: dotnet restore --property:AppTargetFramework=${{ env.TargetFramework }}
    - name: Build
      run: dotnet build --no-restore --configuration Release -p:Version=${{env.version}} --property:AppTargetFramework=${{ env.TargetFramework }}
    - name: Pack
      run: dotnet pack --no-build --configuration Release -p:Version=${{env.version}}
    - name: PushNuget
      run: dotnet nuget push **/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_ORG_KEY }} --skip-duplicate
